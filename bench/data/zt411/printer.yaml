name: zt411_snapshot

fields:
  asset: { type: text, required: true }
  model: { type: enum, values: [ZT411, ZT421], required: true }
  print_method: { type: enum, values: [thermal_transfer, direct_thermal] }
  prompt: { type: enum, values: [ready, paused, calibration_1, calibration_2] }
  enabled: { type: json, source: controller }
  alerts: { type: json, source: controller }
  verified: { type: json, source: controller }
  attempted: { type: json, source: controller }
  notes: { type: text, author: operator }

reads: [asset, model, print_method, prompt, enabled, alerts, verified, attempted, notes]

facts:
  tt_media:
    check: Current evidence about this printer establishes that thermal-transfer media is loaded.
    unstated: true
  dt_media:
    check: Current evidence about this printer establishes that direct-thermal media is loaded.
    unstated: true
  ribbon_loaded:
    check: Current evidence about this printer establishes that a ribbon is loaded.
    unstated: true
  ribbon_absent:
    check: Current evidence about this printer establishes that no ribbon is loaded.
    unstated: true
  detection_symptom:
    check: Current evidence reports a media or ribbon detection problem on this printer, such as skipped labels or an out alert while media is loaded.
  step_verified:
    check: Current evidence verifies that the step requested by this printer's current calibration prompt was completed; a report or command alone is not verification.
  unverified_step:
    check: A loading or calibration step on this printer was attempted or reported but not verified.
  calibration_verified:
    check: Current evidence verifies that this printer's manual sensor calibration completed; a cancelled or commanded calibration is not completion.
    unstated: true
  method_inconsistent:
    check: The configured print method is inconsistent with the media established for this printer.
    unstated: true
  ready_to_print:
    check: This printer's configuration is consistent with its loaded media and ribbon, and any detection symptom has been resolved by a verified calibration.
    unstated: true
  needs_observation:
    check: A decision about this printer depends on a missing, stale or contradictory observation.
  actions:
    select: Which menu actions are justified for this printer now under the procedure document?
    max_claims: 9
    cards:
      - id: set_method_tt
        title: Set print method to thermal transfer
        requires: 'print_method == "direct_thermal" and prompt in ["ready", "paused"]'
        applies_when: [{ fact: tt_media }]
      - id: set_method_dt
        title: Set print method to direct thermal
        requires: 'print_method == "thermal_transfer" and prompt in ["ready", "paused"]'
        applies_when: [{ fact: dt_media }]
      - id: load_ribbon
        title: Load a ribbon
        requires: 'print_method == "thermal_transfer" and prompt in ["ready", "paused"]'
        applies_when: [{ fact: ribbon_absent }]
        excludes: [{ fact: dt_media }]
      - id: start_calibration
        title: Start manual sensor calibration
        requires: 'prompt in ["ready", "paused"]'
        applies_when: [{ fact: detection_symptom }]
        excludes: [{ fact: ribbon_absent }]
      - id: verify_loading
        title: Inspect and verify media and ribbon loading
        applies_when: [{ fact: unverified_step }]
      - id: calibration_next
        title: Confirm the calibration prompt and continue
        requires: 'prompt in ["calibration_1", "calibration_2"]'
        applies_when: [{ fact: step_verified }]
      - id: cancel_calibration
        title: Cancel calibration
        requires: 'prompt in ["calibration_1", "calibration_2"]'
        applies_when: [{ fact: method_inconsistent }]
      - id: resume_printing
        title: Return to printing
        requires: 'prompt == "paused"'
        applies_when: [{ fact: ready_to_print }]
        excludes: [{ fact: ribbon_absent }]
      - id: request_observation
        title: Ask the operator for the missing or conflicting observation
        applies_when: [{ fact: needs_observation }]

cases:
  - { id: act, when: not actions is empty, then: act }
otherwise: wait
