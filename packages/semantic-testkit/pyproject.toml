[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-testkit"
version = "0.1.0"
description = "Repository test support shared by semantic-switch and semantic-trainer tests; never shipped in either application wheel."
requires-python = ">=3.12"
dependencies = ["semantic-switch", "numpy", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_testkit = ["data/*.json"]
