[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-trainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["semantic-switch>=0.26,<0.27"]

[project.optional-dependencies]
lexical = ["scikit-learn>=1.5", "scipy>=1.12"]
lora = ["semantic-switch[local]>=0.26,<0.27", "torch>=2.8", "transformers>=4.57", "peft>=0.17", "safetensors>=0.6"]

[project.scripts]
semantic-trainer = "semantic_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real llama.cpp inference or the pinned conversion toolchain"]
