[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-switch"
version = "0.26.0"
description = "Language-based judgments inside ordinary code: local, cheap, multilingual."
requires-python = ">=3.12"
dependencies = ["numpy", "pyyaml", "pydantic>=2", "typer", "jinja2"]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3.30", "huggingface_hub"]
hosted = ["httpx", "anyio>=4.4"]
dev = ["pytest"]

[project.scripts]
ss = "semantic_switch.cli:main"

[tool.setuptools.packages.find]
include = ["semantic_switch*"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/tests", "specialists/routing/tests"]
markers = ["slow: needs the real llama.cpp models"]
